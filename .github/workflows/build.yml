name: Build and Push LiteLLM

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push LiteLLM
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            satya490/litellm:latest
            satya490/litellm:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=satya490/litellm:buildcache
          cache-to: type=registry,ref=satya490/litellm:buildcache,mode=max

      - name: Trigger manifest update
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run update-manifests.yml \
            --repo Satya-jit/homelab-infra \
            -f litellm-tag=${{ github.sha }} \
            -f sha=${{ github.sha }}
