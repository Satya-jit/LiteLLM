version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: ${DB_USER:-litellm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-litellm@secure123}
    ports:
      - "5432:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - litellm-network
    restart: unless-stopped

  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      UI_USERNAME: ${USERNAME}
      UI_PASSWORD: ${PASS}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/litellm
    ports:
      - "8000:8000"
    networks:
      - litellm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  litellm_postgres_data:

networks:
  litellm-network:
    driver: bridge
